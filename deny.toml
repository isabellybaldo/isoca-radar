  { name = "polymarkets-rs-clob-client" },
  { name = "alloy-signer" },
  { name = "alloy-signer-local" },
  { name = "ethers-signers" },
  { name = "ethers-core" },
  { name = "libsecp256k1" },
  { name = "ecdsa" },
  { name = "reqwest", wrappers = ["pm-api"] },
  { name = "tokio-tungstenite", wrappers = ["pm-api"] },
]
