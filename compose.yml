# cute-trading v2 — phase A (local). Spec §8.1. The scanner service is added in S2c.
name: cute-trading

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    restart: unless-stopped
    environment:
      POSTGRES_USER: ct_owner
      POSTGRES_DB: cute_trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SCANNER_DB_PASSWORD: ${SCANNER_DB_PASSWORD:?set SCANNER_DB_PASSWORD in .env}
      ANALYZE_DB_PASSWORD: ${ANALYZE_DB_PASSWORD:?set ANALYZE_DB_PASSWORD in .env}
      ANALYZE_RW_DB_PASSWORD: ${ANALYZE_RW_DB_PASSWORD:-}
      COMPACT_RW_DB_PASSWORD: ${COMPACT_RW_DB_PASSWORD:-}
      RESET_RW_DB_PASSWORD: ${RESET_RW_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct_owner -d cute_trading"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
    image: cute-trading/rust:dev
    profiles: ["core"]
    command: ["migrate"]
    environment:
      OWNER_DATABASE_URL: postgres://ct_owner:${POSTGRES_PASSWORD}@postgres:5432/cute_trading
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    logging: *logging
    networks: [internal]

  scanner:
    image: cute-trading/rust:dev
    profiles: ["core"]
    command: ["run"]
    environment:
      DATABASE_URL: postgres://scanner_rw:${SCANNER_DB_PASSWORD}@postgres:5432/cute_trading
      SCANNER_HOST: ${SCANNER_HOST:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5          # spec §8.1.2: a safe-mode exit 0 is NOT restarted
    stop_grace_period: 30s         # flush writer + close episodes + write exit_reason before SIGKILL
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - data:/data
    logging: *logging
    networks: [internal, egress]

  # Phase 5a live cards (spec 2026-09-26-phase5a-cards-design.md §2, §7): no network client in the
  # binary (arch test) and only the `internal` network, which is NOT `internal: true`, so the
  # container itself is not egress-blocked (follow-up: harden that network). Writes only
  # card_cells/card_results/card_meta as analyze_rw, 0.25 CPU and 128 MB like the api.
  analyze:
    image: cute-trading/rust:dev
    profiles: ["core"]
    entrypoint: ["/usr/local/bin/analyze"]
    environment:
      DATABASE_URL: postgres://analyze_rw:${ANALYZE_RW_DB_PASSWORD:?set ANALYZE_RW_DB_PASSWORD in .env}@postgres:5432/cute_trading
      ANALYZE_EVERY_SECS: "900"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # unless-stopped (not on-failure): a clean exit 0 at host shutdown must still come back at boot.
    # analyze has no safe mode, so restarting whenever it wasn't deliberately stopped is correct.
    # The scanner keeps on-failure (safe mode exits 0 on purpose) and is started at boot by
    # deploy/systemd/isoca-radar-scanner.service instead.
    restart: unless-stopped
    stop_grace_period: 10s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cpus: "0.25"
    mem_limit: 128m
    logging: *logging
    networks: [internal]

  # Phase 5b tiered storage (spec 2026-09-27-phase5b-tiered-storage-design.md §2): every closed raw
  # hour → the Parquet archive. No network client in the binary (arch test); Postgres only through
  # store as compact_rw (writes compact_hours/compact_status only). Reads the raw capture read-only.
  compact:
    image: cute-trading/rust:dev
    profiles: ["core"]
    entrypoint: ["/usr/local/bin/compact"]
    command: ["run"]
    environment:
      DATABASE_URL: postgres://compact_rw:${COMPACT_RW_DB_PASSWORD:?set COMPACT_RW_DB_PASSWORD in .env}@postgres:5432/cute_trading
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # unless-stopped (not on-failure): compact has no safe mode, same reasoning as analyze above —
    # a clean exit at host shutdown must still come back at boot, and on-failure would leave it
    # down after a reboot instead of resuming the archive.
    restart: unless-stopped
    stop_grace_period: 30s          # an hour in progress may be killed: its writes are atomic
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cpus: "0.25"
    mem_limit: 512m
    volumes:
      - data:/data:ro
      - archive:/archive
    logging: *logging
    networks: [internal]

volumes:
  pgdata: {}
  data: {}
  archive: {}

networks:
  internal: {}
  egress: {}
