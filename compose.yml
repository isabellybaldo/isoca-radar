# cute-trading v2 — phase A (local). Spec §8.1. The scanner service is added in S2c.
name: cute-trading

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    restart: unless-stopped
    environment:
      POSTGRES_USER: ct_owner
      POSTGRES_DB: cute_trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SCANNER_DB_PASSWORD: ${SCANNER_DB_PASSWORD:?set SCANNER_DB_PASSWORD in .env}
      ANALYZE_DB_PASSWORD: ${ANALYZE_DB_PASSWORD:?set ANALYZE_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct_owner -d cute_trading"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
    image: cute-trading/rust:dev
    profiles: ["core"]
    command: ["migrate"]
    environment:
      OWNER_DATABASE_URL: postgres://ct_owner:${POSTGRES_PASSWORD}@postgres:5432/cute_trading
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    logging: *logging
    networks: [internal]

  scanner:
    image: cute-trading/rust:dev
    profiles: ["core"]
    command: ["run"]
    environment:
      DATABASE_URL: postgres://scanner_rw:${SCANNER_DB_PASSWORD}@postgres:5432/cute_trading
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5          # spec §8.1.2: a safe-mode exit 0 is NOT restarted
    stop_grace_period: 30s         # flush writer + close episodes + write exit_reason before SIGKILL
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - data:/data
    logging: *logging
    networks: [internal, egress]

volumes:
  pgdata: {}
  data: {}

networks:
  internal: {}
  egress: {}
