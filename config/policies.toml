# Paper-trading accounts (spec §11). FROZEN before each evaluation run: its sha256 is recorded with
# every paper account (pre-registration). Money is written as strings so it parses exactly.
settle_delay_ms = 2000                  # NO→collateral conversion: bought tokens unspendable ~1–3 s (polybots)
markout_offsets_ms = [1000, 5000, 30000]
mark_every_ms = 60000
burst_window_ms = 10000
min_order_shares = "5"                  # Q6

[p1]
min_annualized = "0.10"                 # P1 takes complete YES baskets with annualized ≥ 10 % ...
max_days_to_end = "30"                  # ... and days_to_end ≤ 30

# Latency (spec §5.6): t_x = r_open + proc + net + match × burst + max secondsDelay (if honored).
# match_ms priors are third-party and crypto-specific (polybots): a sensitivity band, not a point
# estimate. Burst thresholds are frames/s over burst_window_ms; recalibrate them from the soak's
# `health.msgs` before the first evaluation run.
[[scenarios]]
name = "colo-idle"
proc_ms = 1
net_ms = 1
match_ms = 50
honor_seconds_delay = true

[[scenarios]]
name = "sp-idle"
proc_ms = 5
net_ms = 145                            # São Paulo → CLOB, RTT/2 (spec §5.6)
match_ms = 150
honor_seconds_delay = true

[[scenarios]]
name = "sp-burst"
proc_ms = 5
net_ms = 145
match_ms = 300
honor_seconds_delay = true
burst = [
  { frames_per_s_above = 2000, multiplier = 3 },
  { frames_per_s_above = 6000, multiplier = 10 },
]

[[scenarios]]
name = "sp-idle-nodelay"                # Q1 sensitivity: secondsDelay ignored
proc_ms = 5
net_ms = 145
match_ms = 150
honor_seconds_delay = false

# Phase 7a latency ladder (spec 2026-09-29 §2, §3): exact latencies, no burst steps. d = proc +
# net + match is the time from the exchange showing the edge to our order matching; rung-0 is the
# impossible baseline (filled on the book that showed the edge). sp-burst and sp-idle-nodelay stay
# extras beside the ladder.
[[scenarios]]
name = "rung-0"
proc_ms = 0
net_ms = 0
match_ms = 0
honor_seconds_delay = true

[[scenarios]]
name = "rung-25"
proc_ms = 0
net_ms = 0
match_ms = 25
honor_seconds_delay = true

[[scenarios]]
name = "rung-100"                       # a bot in the exchange's cloud region
proc_ms = 5
net_ms = 45
match_ms = 50
honor_seconds_delay = true

[[scenarios]]
name = "rung-200"                       # us on a good day
proc_ms = 5
net_ms = 95
match_ms = 100
honor_seconds_delay = true

[[accounts]]
policy = "P0-converter"
scenario = "colo-idle"
bankroll = "1000"
