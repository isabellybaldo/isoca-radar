name: ci
on:
  push:
    branches: [refactor, main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: ct_owner
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ct_owner"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ct_owner:ci-only-throwaway@localhost:5432/postgres
      STORE_TESTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install cargo-deny --locked
      - run: cargo deny check bans advisories
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f compose.yml -f compose.web.yml --profile core --profile web config -q
