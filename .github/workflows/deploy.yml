name: Deploy to VPS

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_PATH }}
            git pull origin deploy

            cat > backend/.env << 'ENVEOF'
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            GAMMA_API_URL=https://gamma-api.polymarket.com
            CLOB_API_URL=https://clob.polymarket.com
            DATA_API_URL=https://data-api.polymarket.com
            DATABASE_URL=postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_SCHEMA=${{ secrets.POSTGRES_SCHEMA }}
            REDIS_URL=redis://:${{ secrets.REDIS_PASSWORD }}@redis:6379/0
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            POLYMARKET_API_KEY=${{ secrets.POLYMARKET_API_KEY }}
            POLYMARKET_PRIVATE_KEY=${{ secrets.POLYMARKET_PRIVATE_KEY }}
            CLOB_API_KEY=${{ secrets.CLOB_API_KEY }}
            CLOB_SECRET=${{ secrets.CLOB_SECRET }}
            CLOB_PASSPHRASE=${{ secrets.CLOB_PASSPHRASE }}
            SCHEDULER_INTERVAL_HOURS=6
            LEADERBOARD_LIMIT=100
            ENVEOF

            docker compose up -d --build
            docker system prune -f
