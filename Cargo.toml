[workspace]
resolver = "3"
members = ["crates/arb-core", "crates/pm-api", "crates/store", "crates/sim", "crates/cards", "crates/arb-wasm", "crates/tape", "spikes/probe", "bins/scanner", "bins/api", "bins/analyze", "bins/compact"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
rust_decimal = "1.41"
rust_decimal_macros = "1.40"
thiserror = "2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
zstd = "0.14"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
sha2 = "0.10"
fs4 = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal", "migrate", "macros", "derive"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
# Phase 5b, owner-approved 2026-09-27: the compactor's Parquet archive. compact only (deny.toml wrappers, arch test).
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "zstd"] }
arrow = { version = "=60.0.0", default-features = false }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
