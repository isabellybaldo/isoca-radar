# Two servers in one nginx. Security headers (HSTS, CSP, frame, nosniff, referrer) are set by Traefik
# middlewares in compose.web.yml, so every router gets the same ones; this file sets only Cache-Control.
# /api/* never reaches here.

# 8080: the dashboard SPA, behind login (Traefik's ct-web router, forward-auth). It has no /math
# location: /math falls to the SPA fallback; a logged-in user could still fetch /math-assets/* or
# /math.html from the shared html dir, which is harmless (they are public files anyway).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# 8081: the public playground (Traefik's ct-math router, no login). Its own server, so a crafted path
# (/math-assets/..%2findex.html) that Traefik's prefix match lets through can only reach what is listed
# here: the three locations and a 404 for everything else, never the dashboard's files.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    gzip_vary on;
    # nginx's default (off) drops both gzip and gzip_static for a request that carries a Via header
    # (a client behind a proxy): the wasm would then go out at 491 KB instead of 120 KB
    gzip_proxied any;

    location = /math {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files /math.html =404;
    }

    location /math-assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # check-math-bundle.mjs writes a .gz beside each asset: no gzip work per request
        gzip_static on;
        try_files $uri =404;
    }

    # The snapshot the api rewrites every 5 minutes; only this exact file comes from the volume, which is
    # mounted read-only at /srv/ct-public-root/math-data (public.json.tmp is never served).
    location = /math-data/public.json {
        root /srv/ct-public-root;
        disable_symlinks on;
        add_header Cache-Control "public, max-age=60";
        gzip on;
        gzip_types application/json;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
