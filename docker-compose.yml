services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cute_trading}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Override with docker service hostnames
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cute_trading}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks:
      - default
      - traefik  # must be on the same network as Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.polymarket.rule=Host(`isoca.space`) && PathPrefix(`/polymarket`)"
      - "traefik.http.routers.polymarket.entrypoints=websecure"
      - "traefik.http.routers.polymarket.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.polymarket-strip.stripprefix.prefixes=/polymarket"
      - "traefik.http.routers.polymarket.middlewares=polymarket-strip"
      - "traefik.http.services.polymarket.loadbalancer.server.port=80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  traefik:
    external: true
    name: traefik_public
